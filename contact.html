<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ | SDROne</title>
  <meta name="description" content="SDROne へのお問い合わせ">
  <meta name="theme-color" content="#12a9b8">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <a class="logo" href="index.html"><img src="assets/icon-white.svg" alt=""><span>SDRONE</span></a>
      <nav class="menu"><a href="index.html">Home</a><a href="index.html#faq">FAQ</a></nav>
    </div>
  </header>
  <section class="doc-head">
    <div class="wrap">
      <div class="label">Contact</div>
      <h1>お問い合わせ</h1>
    </div>
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true" style="margin-top:60px"><path class="wave-white" d="M0 70c220-60 420-70 640-30s420 70 600 40 160-40 200-50v90H0Z"/></svg>
  </section>

  <main class="wrap doc">
    <p>不具合の<wbr>報告や<wbr>ご要望は<wbr>こちらから<wbr>どうぞ。<wbr>アプリの<wbr>「詳細設定」からも<wbr>メールで<wbr>送れます。<wbr>返信が<wbr>必要な<wbr>場合は、<wbr>メールアドレスを<wbr>入れてください。<wbr>先に<a href="index.html#faq">よくある質問</a>も<wbr>見て<wbr>もらえると、<wbr>すぐに<wbr>解決するかもしれません。</p>

    <form id="contact" class="form" action="https://formspree.io/f/xbgdqavl" method="POST">
      <div class="field">
        <label for="kind">種類</label>
        <select id="kind" name="種類">
          <option>不具合の報告</option>
          <option>機能の要望</option>
          <option>その他</option>
        </select>
      </div>
      <div class="field">
        <label for="name">お名前 <span class="opt">任意</span></label>
        <input id="name" name="名前" type="text" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">メールアドレス <span class="opt">返信が<wbr>必要な<wbr>場合</span></label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email">
      </div>
      <div class="field">
        <label for="device">お使いの<wbr>端末と<wbr> iOS の<wbr>バージョン <span class="opt">任意</span></label>
        <input id="device" name="端末" type="text" placeholder="例: iPhone 15 / iOS 18.2">
      </div>
      <div class="field">
        <label for="message">本文</label>
        <textarea id="message" name="本文" rows="7" required placeholder="不具合の場合は、何をしたときにどうなったかを書いてもらえると助かります。"></textarea>
      </div>
      <!-- Spam trap: hidden from people, filled in by bots -->
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="trap" aria-hidden="true">
      <input type="hidden" name="_subject" value="SDROne お問い合わせ">

      <p class="form-note">送信した<wbr>内容は<wbr>フォームサービスの<wbr> Formspree を<wbr>通じて<wbr>開発者に<wbr>届きます。<wbr>詳しくは<a href="privacy.html">プライバシーポリシー</a>を<wbr>ご覧ください。</p>
      <button type="submit" class="submit">送信する</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer class="footer">
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true"><path class="wave-teal" d="M0 60c200-50 430-60 650-20s430 70 610 40 140-40 180-50v90H0Z"/></svg>
    <div class="footer-body">
      <div class="wrap footer-inner">
        <div><p class="big">SDROne</p></div>
        <nav aria-label="フッター"><a href="index.html">ホーム</a><a href="privacy.html">プライバシーポリシー</a></nav>
      </div>
      <div class="wrap copy">© 2026 SDROne</div>
    </div>
  </footer>

  <script>
    // Send in the background so the visitor stays on this page; without JS the form posts normally.
    const form = document.getElementById('contact');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = form.querySelector('.submit');
      button.disabled = true;
      status.className = 'status';
      status.textContent = '送信しています…';
      try {
        const res = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error(String(res.status));
        form.reset();
        status.classList.add('ok');
        status.textContent = '送信しました。ありがとうございます。';
      } catch {
        status.classList.add('ng');
        status.textContent = '送信できませんでした。時間をおいて、もう一度お試しください。';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
